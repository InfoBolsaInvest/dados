# Cotações da B3 a cada 15 minutos no pregão (10h às 18h45 de Brasília, de segunda a sexta).
# Publica os arquivos no GitHub Pages; se a busca falhar, o site continua com os dados anteriores.
name: cotacoes

on:
  schedule:
    - cron: '*/15 13-21 * * 1-5' # horário UTC (Brasília + 3h)
    - cron: '0 12 1 * *' # todo dia 1: mantém o agendamento ativo (o GitHub pausa repositórios parados há 60 dias)
  workflow_dispatch:
    inputs:
      historico:
        description: 'Buscar o histórico agora (1 = sim)'
        required: false
        default: ''
      teste:
        description: 'Mandar um aviso de teste pra cada celular registrado (1 = sim)'
        required: false
        default: ''
      recado_titulo:
        description: 'Recado: título (curto)'
        required: false
        default: ''
      recado_texto:
        description: 'Recado: texto'
        required: false
        default: ''
      recado_link:
        description: 'Recado: link que abre ao tocar (opcional, começa com https://)'
        required: false
        default: ''
      recado_para:
        description: 'Recado: teste = só pro celular do dono; todos = todo mundo com Novidades ligado'
        required: false
        type: choice
        options: [teste, todos]
        default: teste
      telegram:
        description: 'Telegram: teste = mensagem de teste; falha = simula uma falha'
        required: false
        type: choice
        options: [nada, teste, falha]
        default: nada

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cotacoes
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Trazer o que o aviso do Telegram já mandou
        uses: actions/cache/restore@v4
        with:
          path: .alerta
          key: alerta-${{ github.run_id }}
          restore-keys: alerta-
      - name: Trazer o histórico guardado
        uses: actions/cache/restore@v4
        with:
          path: |
            site/historico
            site/longo
            site/tesouro
          key: historico-${{ github.run_id }}
          restore-keys: historico-
      - name: Buscar cotações
        id: cot
        run: node atualizar.mjs
      - name: Conferir com o arquivo oficial da B3
        id: b3
        continue-on-error: true # se a B3 estiver fora, fica só o que a brapi trouxe
        run: node b3.mjs
      - name: Ibovespa, dólar e histórico
        id: hist
        continue-on-error: true # se falhar, as cotações saem do mesmo jeito
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          HISTORICO: ${{ github.event.inputs.historico }}
        run: node historico.mjs
      - name: Dólar, bolsas de fora e 5 anos (Yahoo)
        id: yahoo
        continue-on-error: true
        env:
          HISTORICO: ${{ github.event.inputs.historico }}
        run: node yahoo.mjs
      - name: Nome de ativo novo que veio só com o ticker (Yahoo)
        id: nomes
        continue-on-error: true
        run: node nomes.mjs site/longo/nomes-novos.json
      - name: Proventos e valor patrimonial (B3, CVM e Yahoo; 1x por dia)
        id: fund
        continue-on-error: true
        env:
          FUNDAMENTOS: ${{ github.event.inputs.historico }}
        run: node fundamentos.mjs
      - name: Agenda (Copom, feriados, IBGE)
        id: agenda
        continue-on-error: true
        run: node calendario.mjs
      - name: Renda fixa (Banco Central e Tesouro; 1x por dia)
        id: rf
        continue-on-error: true
        env:
          HISTORICO: ${{ github.event.inputs.historico }}
        run: node rendafixa.mjs
      - name: Vídeos do canal
        id: videos
        continue-on-error: true
        run: node videos.mjs
      - name: Notícias
        id: noticias
        continue-on-error: true
        run: node noticias.mjs
      - name: Entrar no Google sem chave (Workload Identity Federation)
        id: google
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/190730635858/locations/global/workloadIdentityPools/github/providers/github
          service_account: avisos-robo@infobolsa-investimentos.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false # só o acesso temporário (1 hora); nenhum arquivo de credencial na pasta
      - name: Repor o que falhou com a versão publicada
        id: repor
        run: |
          for f in mercado fundamentos isin calendario videos noticias rendafixa; do
            [ -f "site/$f.json" ] || curl -sf "https://infobolsainvest.github.io/dados/$f.json" -o "site/$f.json" || echo "sem $f.json"
          done
      - name: Avisos no celular
        id: avisos
        if: steps.google.outcome == 'success'
        continue-on-error: true
        env:
          GOOGLE_TOKEN: ${{ steps.google.outputs.access_token }}
          TESTE: ${{ github.event.inputs.teste }}
          RECADO_TITULO: ${{ github.event.inputs.recado_titulo }}
          RECADO_TEXTO: ${{ github.event.inputs.recado_texto }}
          RECADO_LINK: ${{ github.event.inputs.recado_link }}
          RECADO_PARA: ${{ github.event.inputs.recado_para }}
        run: node avisos.mjs
      - name: Guardar o histórico novo
        if: hashFiles('.historico-novo') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            site/historico
            site/longo
            site/tesouro
          key: historico-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publicar
        id: publicar
        uses: actions/deploy-pages@v4
      - name: Manter o agendamento ativo
        if: github.event.schedule == '0 12 1 * *'
        run: |
          git config user.name "InfoBolsa"
          git config user.email "contato@infobolsainvestimentos.com"
          git commit --allow-empty -m "Mantém o agendamento ativo"
          git push
      - name: Avisar no Telegram o que falhou
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          PASSOS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          EVENTO: ${{ github.event_name }}
          MODO: ${{ github.event.inputs.telegram }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node alerta.mjs
      - name: Guardar o que o aviso do Telegram já mandou
        if: always() && hashFiles('.alerta/estado.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .alerta
          key: alerta-${{ github.run_id }}
